<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Skyline · Chart your skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--type-family:"Instrument Serif",Georgia,serif;--type-size:36px;--type-weight:400;--type-track:0em;--type-align:center;--type-case:none;--type-style:normal;--bg:#f5f2ea;--card:#fff;--ink:#16182a;--mut:#6b6f85;--ac:#e8590c;--ac2:#5b5bd6;--ln:#e3dfd3;--ok:#2f9e6b;--bad:#d6336c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0c1b;--card:#13162b;--ink:#ecebf6;--mut:#8f93b2;--ln:#252949;--ac:#ffb454;--ac2:#8f8fff;--ok:#5fd3a0;--bad:#ff7aa8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0c1b;--card:#13162b;--ink:#ecebf6;--mut:#8f93b2;--ln:#252949;--ac:#ffb454;--ac2:#8f8fff;--ok:#5fd3a0;--bad:#ff7aa8;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Space Grotesk',system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(1px 1px at 20% 30%,var(--mut),transparent),radial-gradient(1px 1px at 70% 60%,var(--mut),transparent),radial-gradient(1.5px 1.5px at 85% 15%,var(--ac2),transparent),radial-gradient(1px 1px at 40% 85%,var(--mut),transparent);background-size:340px 340px;background-attachment:fixed}
h1,h2,h3{font-family:var(--type-family);font-size:var(--type-size);font-weight:var(--type-weight);font-style:var(--type-style);letter-spacing:var(--type-track);text-transform:var(--type-case);font-variant:var(--type-variant,normal);text-align:var(--type-align);margin:0 0 .4em;line-height:1.12}h1{font-size:clamp(var(--type-size),6vw,calc(var(--type-size) * 1.35))}h2{font-size:calc(var(--type-size) * .78)}h3{font-size:calc(var(--type-size) * .58)}
a{color:var(--ac2)}button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--ac);color:#1a1205;border:0;border-radius:99px;padding:.6em 1.2em;font-weight:700;cursor:pointer}.btn.g{background:transparent;border:1px solid var(--ln);color:var(--ink)}.btn.s{padding:.3em .8em;font-size:.85rem}.btn:disabled{opacity:.5}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:.6em .8em}label{display:block;font-size:.8rem;color:var(--mut);margin:.8em 0 .25em}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:1.2rem;margin-bottom:1rem}.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut)}.chip{display:inline-flex;gap:.4em;align-items:center;border:1px solid var(--ln);border-radius:99px;padding:.15em .7em;font-size:.82rem;margin:.15em;background:var(--bg)}.chip b{cursor:pointer;color:var(--bad)}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}nav{position:sticky;top:0;height:100vh;padding:1.2rem .8rem;border-right:1px solid var(--ln);background:var(--card)}nav .logo{font-family:var(--type-family);font-size:calc(var(--type-size) * .62);font-weight:var(--type-weight);font-style:var(--type-style);letter-spacing:var(--type-track);text-transform:var(--type-case);text-align:var(--type-align);padding:0 .6rem 1rem;color:var(--ac)}
nav a{display:flex;gap:.7rem;padding:.55rem .7rem;border-radius:10px;color:var(--mut);text-decoration:none}nav a.on,nav a:hover{background:var(--bg);color:var(--ink)}nav a.on span:first-child{color:var(--ac)}
main{padding:1.6rem clamp(1rem,3vw,2.4rem);max-width:1100px;width:100%}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:9px;transition:width .6s}
.big{font:800 2.4rem Fraunces,serif}.step{display:grid;grid-template-columns:auto 1fr;gap:1rem}.step.dn{opacity:.6}.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--ac2);background:none;cursor:pointer;color:var(--ok);font-weight:900}.dn .tick{background:var(--ok);color:#fff;border-color:var(--ok)}
.tag{font-size:.72rem;border-radius:6px;padding:.1em .5em;background:var(--ac2);color:#fff}.tag.r{background:var(--bad)}
.feed div{font-size:.84rem;padding:.35rem 0;border-bottom:1px dashed var(--ln)}.feed b{color:var(--ac2)}
#chat{height:52vh;overflow:auto;display:flex;flex-direction:column;gap:.6rem;padding:.5rem}.m{max-width:85%;padding:.6rem .9rem;border-radius:14px;background:var(--bg);border:1px solid var(--ln)}.m.u{align-self:flex-end;background:var(--ac2);color:#fff;border:0}.m pre{background:#0008;color:#fff;padding:.6rem;border-radius:8px;overflow-x:auto}
#busy{position:fixed;inset:0;display:flex;gap:.8rem;align-items:center;justify-content:center;background:#0009;color:#fff;z-index:50;backdrop-filter:blur(3px)}.spin{width:22px;height:22px;border:3px solid #fff4;border-top-color:var(--ac);border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(1turn)}}
.toast{position:fixed;left:50%;bottom:5rem;transform:translateX(-50%);background:var(--ok);color:#fff;padding:.6rem 1.1rem;border-radius:12px;z-index:60}.toast.bad{background:var(--bad)}
.modal{position:fixed;inset:0;background:#000a;z-index:40;display:flex;align-items:center;justify-content:center;padding:1rem}.modal .card{max-width:560px;width:100%;max-height:90vh;overflow:auto}
.hero{max-width:1000px;margin:0 auto;padding:3rem 1.2rem;text-align:center}.hero svg{max-width:520px;width:100%}@keyframes tw{50%{opacity:.3}}.tw{animation:tw 3s infinite}
.wk{display:flex;gap:.5rem;align-items:flex-end;height:90px}.wk div{flex:1;text-align:center;font-size:.7rem;color:var(--mut)}.wk i{display:block;background:var(--ac2);border-radius:6px 6px 0 0;min-height:3px}
@media(max-width:800px){.shell{grid-template-columns:1fr}nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;z-index:20;display:flex;overflow-x:auto;padding:.3rem;border-right:0;border-top:1px solid var(--ln);padding-bottom:calc(.3rem + env(safe-area-inset-bottom,0px))}nav .logo{display:none}nav a{flex-direction:column;align-items:center;font-size:.65rem;gap:0;padding:.3rem .6rem}main{padding-bottom:5.5rem}}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.cover{position:relative;height:clamp(150px,28vw,240px);border-radius:18px;background-size:cover;background-position:center 55%;border:1px solid var(--ln);margin-bottom:3.4rem}.cover .ch{position:absolute;right:.8rem;top:.8rem;margin:0;cursor:pointer;background:var(--card);color:var(--ink)}.cover .av{position:absolute;left:1.2rem;bottom:-2.4rem;width:84px;height:84px;border-radius:50%;background:var(--ac);color:#1a1205;display:grid;place-items:center;font:700 2rem 'Space Grotesk',sans-serif;border:4px solid var(--bg)}.cover .nm{position:absolute;left:7.4rem;bottom:-2.6rem}
.card,nav{backdrop-filter:blur(10px)}.card{background:color-mix(in srgb,var(--card) 84%,transparent)}nav{background:color-mix(in srgb,var(--card) 88%,transparent)}

const def=()=>({in:0,acc:null,user:null,skills:{},goal:'',need:{},an:null,done:{},rm:[],scores:[],log:[],feed:[],chat:[],theme:'',typography:{family:'serif',case:'none',track:0,size:36,weight:400,align:'center',style:'normal'}});
let S;try{S={...def(),...JSON.parse(localStorage.getItem('sky')||'{}')}}catch(e){S=def()}
const save=()=>{try{localStorage.setItem('sky',JSON.stringify(S))}catch(e){}},$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lv=n=>{const k=Object.keys(S.skills).find(x=>x.toLowerCase()===n.toLowerCase());return k?S.skills[k]:0};
const setLv=(n,v)=>{const k=Object.keys(S.skills).find(x=>x.toLowerCase()===n.toLowerCase())||n;S.skills[k]=v};
const match=()=>{const k=Object.keys(S.need||{});if(!k.length)return 0;let a=0,b=0;k.forEach(s=>{a+=Math.min(lv(s),S.need[s]);b+=S.need[s]});return Math.round(a/b*100)};
const pct=()=>S.rm.length?Math.round(S.rm.filter(x=>S.done[x.id]).length/S.rm.length*100):0;
function toast(m,b){const t=document.createElement('div');t.className='toast'+(b?' bad':'');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3500)}
function busy(on,m){let b=$('#busy');if(!on){b&&b.remove();return}if(!b){b=document.createElement('div');b.id='busy';document.body.append(b)}b.innerHTML='<div class="spin"></div><span>'+esc(m)+'</span>'}
function feed(a,m){S.feed.unshift({a,m,t:Date.now()});S.feed=S.feed.slice(0,30);save();const f=$('#feed');if(f)f.innerHTML=feedH()}
const feedH=()=>S.feed.slice(0,8).map(x=>'<div><b>'+esc(x.a)+'</b> · '+esc(x.m)+'</div>').join('')||'<div class="mut">Agents are idle. Pick a career to wake them.</div>';
/* ---------- AI agents ---------- */
let smp;async function ai(){if(smp)return smp;try{smp=await claude.use('sample');return smp}catch(e){}
const k=localStorage.getItem('oaikey');if(!k)return null;
const call=async(p,j)=>{const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'user',content:p}],...(j?{response_format:{type:'json_object'}}:{})})});if(!r.ok)throw 0;return(await r.json()).choices[0].message.content};
const f=async(p,o)=>{const t=await call(p);if(o&&o.onText)o.onText({text:t});return{text:t}};f.json=async p=>JSON.parse(await call(p,1));smp=f;return smp}
async function ask(sys,usr,json){const s=await ai();if(!s)throw 0;const p=sys+'\n\n'+usr+(json?'\nReply with valid JSON only.':'');return json?await s.json(p):(await s(p)).text}
async function careerAgent(g){feed('Career Analysis Agent','Mapping requirements for '+g);try{const r=await ask('You are a career analyst.','List 6-9 core skills a '+g+' needs, ordered by learning prerequisites. Return {"skills":[{"n":name,"l":required level 1-3}]} (1 beginner, 2 intermediate, 3 advanced).',1);const o={};r.skills.slice(0,9).forEach(x=>{if(x.n&&x.l>=1&&x.l<=3)o[String(x.n)]=x.l|0});if(Object.keys(o).length>=4)return o}catch(e){}feed('Career Analysis Agent','AI offline, using built-in role map');return{...(ROLES[g]||{})}}
function analyze(){const gap=[],strong=[];Object.keys(S.need).forEach(s=>{const h=lv(s),n=S.need[s];(h>=n?strong:gap).push({s,h,n})});S.an={gap,strong,note:(S.an&&S.an.note)||''}}
async function skillAgent(){analyze();feed('Skill Analysis Agent','Comparing '+Object.keys(S.skills).length+' skills against role');try{S.an.note=await ask('You are a skill analyst. Reply in 3 short plain-text sentences, encouraging.','Goal: '+S.goal+'. Learner skills: '+JSON.stringify(S.skills)+'. Required: '+JSON.stringify(S.need)+'. Recent scores: '+JSON.stringify(S.scores.slice(-5))+'. Summarize strengths and weaknesses.')}catch(e){S.an.note='You have '+S.an.strong.length+' skills at target level and '+S.an.gap.length+' to build.'}}
async function recAgent(){const st=S.an.gap.map(g=>({id:g.s,skill:g.s,from:g.h,to:g.n,wk:(g.n-g.h)*2,why:'Required for '+S.goal+'.',ex:'Build a small practice task using '+g.s+'.',proj:''}));feed('Learning Recommendation Agent','Sequencing '+st.length+' skills');try{const r=await ask('You are a learning designer.','Goal: '+S.goal+'. For each skill give "why" (1 sentence), "ex" (a concrete practice exercise), "proj" (a mini project). Skills: '+JSON.stringify(st.map(x=>({skill:x.skill,from:LV[x.from],to:LV[x.to]})))+'. Return {"items":[{"skill","why","ex","proj"}]}.',1);r.items.forEach(i=>{const s=st.find(x=>x.skill===i.skill);if(s){s.why=i.why||s.why;s.ex=i.ex||s.ex;s.proj=i.proj||''}})}catch(e){}st.push({id:'final',skill:'Capstone',from:0,to:0,wk:3,why:'Combine everything into one portfolio piece.',ex:'',proj:'Design, build and deploy a '+S.goal+' portfolio project.'});return st}
async function plan(why,reset){busy(1,'Agents are collaborating…');feed('Coordinator',why);if(reset)S.done={};try{S.need=await careerAgent(S.goal);await skillAgent();S.rm=await recAgent();feed('Coordinator','Roadmap ready · '+S.rm.length+' steps · '+match()+'% match')}catch(e){toast('Something went wrong. Please retry.',1)}save();busy(0);route()}
const resL=n=>{const q=encodeURIComponent(n);return[['▶ YouTube','https://www.youtube.com/results?search_query='+q+'+full+tutorial'],['🎓 Courses','https://www.coursera.org/search?query='+q],['📘 Docs','https://www.google.com/search?q='+q+'+official+documentation'],['⌨ Practice','https://www.google.com/search?q='+q+'+coding+practice+exercises']]};
function tog(id){const s=S.rm.find(x=>x.id===id);if(!s)return;if(S.done[id]){delete S.done[id];if(s.to)setLv(s.skill,s.from)}else{S.done[id]=Date.now();S.log.push({t:Date.now()});if(s.to)setLv(s.skill,Math.max(lv(s.skill),s.to));analyze();feed('Progress Evaluation Agent',s.skill+' done → match '+match()+'%');if(S.rm.every(x=>S.done[x.id]))toast('Roadmap complete! 🎉')}analyze();save();route()}
let Q;async function quiz(skill){busy(1,'Progress Agent is writing your quiz…');try{const r=await ask('You are a technical examiner.','Write 4 multiple-choice questions on '+skill+' at '+LV[Math.min(3,lv(skill)+1)]+' level. Return {"q":[{"t":question,"o":[4 options],"a":correct index 0-3}]}.',1);const q=r.q.filter(x=>x.o&&x.o.length==4).slice(0,4);if(!q.length)throw 0;Q={skill,q,a:{}}}catch(e){busy(0);return toast('Quiz unavailable right now. Try again.',1)}busy(0);showQ()}
function showQ(){const m=document.createElement('div');m.className='modal';m.id='qm';m.innerHTML='<div class="card"><h3>Quiz · '+esc(Q.skill)+'</h3>'+Q.q.map((x,i)=>'<p><b>'+(i+1)+'. '+esc(x.t)+'</b></p>'+x.o.map((o,j)=>'<label style="color:var(--ink);font-size:.95rem"><input type="radio" name="q'+i+'" value="'+j+'" style="width:auto"> '+esc(o)+'</label>').join('')).join('')+'<div class="row" style="margin-top:1rem"><button class="btn" onclick="scoreQ()">Submit</button><button class="btn g" onclick="$(\'#qm\').remove()">Cancel</button></div></div>';document.body.append(m)}
function scoreQ(){let c=0;for(let i=0;i<Q.q.length;i++){const r=document.querySelector('input[name=q'+i+']:checked');if(!r)return toast('Answer every question first.',1);if(+r.value===+Q.q[i].a)c++}const p=Math.round(c/Q.q.length*100),sk=Q.skill;$('#qm').remove();S.scores.push({skill:sk,pct:p,t:Date.now()});S.log.push({t:Date.now()});feed('Progress Evaluation Agent',sk+' quiz: '+p+'%');
if(p<60){const i=S.rm.findIndex(x=>x.skill===sk&&!x.rem);S.rm.splice(i+1,0,{id:'rem'+Date.now(),skill:sk,from:0,to:0,wk:1,rem:1,why:'You scored '+p+'%. Revisit the fundamentals before moving on.',ex:'Redo '+sk+' exercises for the questions you missed, then retake the quiz.',proj:''});feed('Mentor Agent','Added a remedial block for '+sk);toast('Roadmap updated: remedial block added',1)}else if(p>=80){const s=S.rm.find(x=>x.skill===sk&&!x.rem);if(s&&!S.done[s.id])tog(s.id);feed('Mentor Agent','Great work on '+sk+' — next level unlocked');toast('Strong score! Next level unlocked.')}else toast('Score '+p+'%. Keep practising.');analyze();save();route()}
async function send(m){m=m.trim();if(!m)return;S.chat.push({r:'u',c:m},{r:'a',c:'…'});save();route();const d=S.rm.filter(x=>S.done[x.id]).length;const ctx='You are the AI Mentor on a learning platform. Learner: '+(S.user.name)+'; goal: '+(S.goal||'not chosen')+'; skills: '+JSON.stringify(S.skills)+'; missing: '+(S.an?S.an.gap.map(g=>g.s).join(', '):'n/a')+'; roadmap '+d+'/'+S.rm.length+' done; recent quiz scores: '+JSON.stringify(S.scores.slice(-4))+'. Be concise and friendly; give short code examples and practice questions when useful.\nConversation:\n'+S.chat.slice(-9,-2).map(x=>(x.r=='u'?'Learner: ':'Mentor: ')+x.c).join('\n')+'\nLearner: '+m;
try{const s=await ai();if(!s)throw 0;const r=await s(ctx,{cache:false,onText:({text})=>{S.chat[S.chat.length-1].c=text;paintChat()}});S.chat[S.chat.length-1].c=r.text}catch(e){S.chat[S.chat.length-1].c='The mentor is unavailable right now. Please try again shortly.'}save();paintChat()}
const md=t=>t.split('```').map((p,i)=>i%2?'<pre>'+esc(p.replace(/^\w*\n/,''))+'</pre>':esc(p).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')).join('');
function paintChat(){const c=$('#chat');if(!c)return;c.innerHTML=S.chat.map(x=>'<div class="m '+x.r+'">'+md(x.c)+'</div>').join('')||'<div class="mut">Ask anything: concepts, practice questions, how you’re doing.</div>';c.scrollTop=c.scrollHeight}

const star=(x,y,r,o)=>'<circle class="tw" style="animation-delay:'+o+'s" cx="'+x+'" cy="'+y+'" r="'+r+'" fill="var(--ac)"/>';
function consV(){const k=Object.keys(S.need);if(!k.length)return'<p class="mut">Choose a career to chart your constellation.</p>';const P=k.map((s,i)=>{const a=i/k.length*6.283-1.57;return[180+Math.cos(a)*120,170+Math.sin(a)*115,s]});
let g='<svg viewBox="0 0 360 340" width="100%" style="max-width:480px">'+P.map((p,i)=>{const q=P[(i+1)%P.length];return'<line x1="'+p[0]+'" y1="'+p[1]+'" x2="'+q[0]+'" y2="'+q[1]+'" stroke="var(--ln)" stroke-dasharray="3 4"/>'}).join('');
g+=P.map(p=>{const h=lv(p[2]),n=S.need[p[2]],ok=h>=n,f=Math.min(1,h/n);return'<g><circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(8+n*3)+'" fill="none" stroke="'+(ok?'var(--ok)':'var(--ln)')+'" stroke-width="1.5"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(3+f*(5+n*3))+'" fill="'+(ok?'var(--ok)':f>0?'var(--ac)':'var(--mut)')+'" opacity="'+(f>0?1:.5)+'"/><text x="'+p[0]+'" y="'+(p[1]+(p[1]>170?27:-17))+'" text-anchor="middle" font-size="11" fill="var(--ink)">'+esc(p[2])+'</text></g>'}).join('');return g+'</svg><p class="mut" style="font-size:.8rem">Ring = required level · filled star = your level. Green = target reached.</p>'}
function landV(){return'<div class="hero"><svg viewBox="0 0 400 200" aria-hidden="true"><g stroke="var(--ln)" fill="none"><path d="M30 150 90 90 160 120 230 50 300 90 370 30"/></g>'+[[30,150],[90,90],[160,120],[230,50],[300,90],[370,30]].map((p,i)=>star(p[0],p[1],5+i%3*2,i*.4)).join('')+'</svg><h1>Your skills, <span style="color:var(--ac)">charted.</span></h1><p class="mut" style="max-width:560px;margin:0 auto 1.5rem">Skyline turns your skills into a constellation. Six AI agents find the missing stars and draw the shortest path to your dream role.</p><div class="row" style="justify-content:center"><a href="#signup"><button class="btn">Start charting</button></a><a href="#login"><button class="btn g">Log in</button></a><button class="btn g" onclick="demo()">▶ Try the demo scenario</button></div><div class="grid" style="margin-top:3rem;text-align:left">'+[['Career Analysis','Reads the role and lists what it truly demands.'],['Skill Analysis','Finds your strengths and gaps.'],['Learning Recommendation','Builds an ordered roadmap with resources.'],['Progress Evaluation','Quizzes you and tracks every win.'],['AI Mentor','Coaches you with your own data.'],['Coordinator','Makes them talk and re-plans when things change.']].map(x=>'<div class="card"><h3>'+x[0]+'</h3><span class="mut">'+x[1]+'</span></div>').join('')+'</div></div>'}
function authV(m){const s=m=='signup';return'<div class="hero" style="max-width:420px;text-align:left"><h2>'+(s?'Create your account':'Welcome back')+'</h2><div class="card">'+(s?'<label>Name</label><input id="nm" autocomplete="name">':'')+'<label>Email</label><input id="em" type="email" autocomplete="email"><label>Password</label><input id="pw" type="password" autocomplete="'+(s?'new':'current')+'-password"><p id="err" style="color:var(--bad);min-height:1.4em;margin:.6em 0 0"></p><button class="btn" style="width:100%" onclick="auth(\''+m+'\')">'+(s?'Sign up':'Log in')+'</button></div><p class="mut">'+(s?'Have an account? <a href="#login">Log in</a>':'New here? <a href="#signup">Sign up</a>')+' · <a href="#">Home</a></p></div>'}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function auth(m){const em=$('#em').value.trim(),pw=$('#pw').value,e=$('#err');if(m=='signup'){const nm=$('#nm').value.trim();if(nm.length<2)return e.textContent='Enter your name.';if(!/^\S+@\S+\.\S+$/.test(em))return e.textContent='Enter a valid email.';if(pw.length<8)return e.textContent='Password needs 8+ characters.';S.acc={em,h:await sha(pw)};S.user={name:nm,email:em,edu:'',exp:'',certs:[],projects:[]};S.in=1;save();location.hash='careers'}else{if(!S.acc||S.acc.em!==em||S.acc.h!==await sha(pw))return e.textContent='Email or password is incorrect.';S.in=1;save();location.hash='dashboard'}route()}
function week(){const d=[];for(let i=6;i>=0;i--){const t=new Date();t.setHours(0,0,0,0);t.setDate(t.getDate()-i);d.push([t.toLocaleDateString('en',{weekday:'short'}),S.log.filter(l=>l.t>=+t&&l.t<+t+864e5).length])}return d}
const weekH=()=>{const w=week(),m=Math.max(1,...w.map(x=>x[1]));return'<div class="wk">'+w.map(x=>'<div><i style="height:'+(x[1]/m*70)+'px"></i>'+x[0]+'</div>').join('')+'</div>'};

in-top:.6rem"><input id="pj" placeholder="Project name" style="flex:1"><button class="btn s" onclick="addP()">Add</button></div></div>'},

mentor:()=>'<h2>AI Mentor</h2><div class="card"><div id="chat"></div><div class="row" style="margin:.6rem 0">'+['Explain my biggest gap','Give me a practice question','How am I doing?'].map(q=>'<button class="btn s g" onclick="send(\''+q+'\')">'+q+'</button>').join('')+'</div><div class="row"><input id="cm" placeholder="Ask your mentor…" style="flex:1" onkeydown="if(event.key==\'Enter\'){send(this.value);this.value=\'\'}"><button class="btn" onclick="const i=$(\'#cm\');send(i.value);i.value=\'\'">Send</button></div></div>',
settings:()=>{const t={family:'serif',case:'none',track:0,size:36,weight:400,align:'center',style:'normal',...(S.typography||{})};return '<h2>Settings</h2><div class="card"><h3>Live typography studio</h3><p class="mut">Customize Skyline headings, section titles and the sidebar logo. Changes preview instantly and are saved on this device.</p><div class="grid"><div><label>Typeface</label><select id="tyFamily" onchange="updateTypography()"><option value="serif"'+(t.family==='serif'?' selected':'')+'>Serif · Instrument Serif</option><option value="italic"'+(t.family==='italic'?' selected':'')+'>Serif Italic · Instrument Serif</option><option value="grotesk"'+(t.family==='grotesk'?' selected':'')+'>GROTESK · Archivo</option><option value="mono"'+(t.family==='mono'?' selected':'')+'>Mono · IBM Plex Mono</option></select></div><div><label>Letter case</label><select id="tyCase" onchange="updateTypography()"><option value="none"'+(t.case==='none'?' selected':'')+'>As typed</option><option value="upper"'+(t.case==='upper'?' selected':'')+'>CAPS</option><option value="small"'+(t.case==='small'?' selected':'')+'>Small caps</option><option value="lower"'+(t.case==='lower'?' selected':'')+'>lower</option></select></div></div><div class="grid"><div><label>Tracking <span id="tyTrackVal">'+Number(t.track).toFixed(2)+'em</span></label><input id="tyTrack" type="range" min="-0.05" max="0.26" step="0.01" value="'+t.track+'" oninput="updateTypography()"></div><div><label>Heading size <span id="tySizeVal">'+t.size+'px</span></label><input id="tySize" type="range" min="22" max="54" step="1" value="'+t.size+'" oninput="updateTypography()"></div></div><div class="grid"><div><label>Weight <span id="tyWeightVal">'+t.weight+'</span></label><input id="tyWeight" type="range" min="300" max="800" step="100" value="'+t.weight+'" '+(t.family==='serif'||t.family==='italic'?'disabled':'')+' oninput="updateTypography()"><p class="mut" id="tyWeightNote">'+(t.family==='serif'||t.family==='italic'?'Single-cut serif · weight fixed':'Adjust from 300 to 800')+'</p></div><div><label>Alignment</label><div class="row"><button class="btn s '+(t.align==='left'?'':'g')+'" onclick="setTypographyAlign(\'left\')">Left</button><button class="btn s '+(t.align==='center'?'':'g')+'" onclick="setTypographyAlign(\'center\')">Center</button></div></div></div><div class="card" style="background:var(--bg);margin-top:1rem"><div class="mut" style="font-size:.75rem">LIVE SPECIMEN</div><div id="tySpecimen" style="font-family:var(--type-family);font-size:var(--type-size);font-weight:var(--type-weight);font-style:var(--type-style);letter-spacing:var(--type-track);text-transform:var(--type-case);text-align:var(--type-align);line-height:1.2;padding:.7rem 0">Aa Bb Cc — 0123456789 &amp; ?!</div></div><button class="btn g s" onclick="resetTypography()">Reset typography</button></div><div class="card"><h3>Background</h3><p class="mut">Animated backdrop behind every page. Move your cursor over the constellation to connect the stars.</p><div class="row">'+[['constellation','Constellation'],['aurora','Aurora'],['grid','Grid'],['none','Plain']].map(b=>'<button class="btn s'+((S.bg||'constellation')==b[0]?'':' g')+'" onclick="setBg(\''+b[0]+'\')">'+b[1]+'</button>').join('')+'</div></div><div class="card"><h3>Theme</h3><div class="row">'+[['','Auto'],['light','Light'],['dark','Dark']].map(t=>'<button class="btn s'+(S.theme==t[0]?'':' g')+'" onclick="S.theme=\''+t[0]+'\';save();paintTheme();route()">'+t[1]+'</button>').join('')+'</div></div><div class="card"><h3>OpenAI API key</h3><p class="mut">Needed for the AI agents. Stored only in this browser (localStorage), never in the code.</p><input id="ok" type="password" placeholder="sk-..." value="'+esc(localStorage.getItem('oaikey')||'')+'"><p><button class="btn s" onclick="localStorage.setItem(\'oaikey\',$(\'#ok\').value.trim());smp=null;toast(\'Key saved\')">Save key</button></p></div><div class="card"><h3>Account</h3><p class="mut">'+esc(S.user.email)+'</p><div class="row"><button class="btn g" onclick="S.in=0;save();location.hash=\'\';route()">Log out</button><button class="btn g" style="color:var(--bad)" onclick="if(confirm(\'Delete all data on this device?\')){localStorage.removeItem(\'sky\');S=def();location.hash=\'\';route()}">Delete data</button></div></div>'}};
const empty=()=>'<div class="card"><h3>Nothing charted yet</h3><p class="mut">Pick a target career and the agents will build this for you.</p><a href="#careers"><button class="btn">Choose a career</button></a></div>';
function demo(){S=def();S.acc={em:'demo@skyline.app',h:''};S.user={name:'Demo Learner',email:'demo@skyline.app',edu:'B.E. CSE (AIML)',exp:'Fresher',certs:[],projects:['Summit chatbot']};S.skills={Python:2,SQL:2,HTML:1};S.in=1;S.goal='Full Stack Developer';save();location.hash='roadmap';plan('Demo: Full Stack Developer goal',1)}
function pick(r){S.goal=r;save();plan(S.rm.length?'Goal changed to '+r+' — rebuilding roadmap':'Goal set to '+r,1).then(()=>location.hash='roadmap')}
function setCover(i){const f=i.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('Choose an image file.',1);const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,1200/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.cover=c.toDataURL('image/jpeg',.8);save();route()};im.onerror=()=>toast('Could not read that image.',1);im.src=r.result};r.readAsDataURL(f)}
function saveP(){const n=$('#pn').value.trim(),e=$('#pe').value.trim();if(n.length<2||!/^\S+@\S+\.\S+$/.test(e))return toast('Enter a valid name and email.',1);Object.assign(S.user,{name:n,email:e,edu:$('#pd').value.trim(),exp:$('#px').value.trim()});const g=$('#pg').value;save();toast('Profile saved');if(g&&g!==S.goal)pick(g);else if(S.goal){analyze();save()}}
function addS(){const n=$('#sn').value.trim();if(!n)return toast('Type a skill name.',1);setLv(n,+$('#sl').value);save();if(S.goal){analyze();save()}route()}
function delS(k){delete S.skills[k];save();if(S.goal)analyze();route()}
function addC(i){if(i.files[0]){S.user.certs.push(i.files[0].name);save();route()}}
function addP(){const v=$('#pj').value.trim();if(!v)return toast('Name your project.',1);S.user.projects.push(v);save();route()}
const paintTheme=()=>{if(S.theme)document.documentElement.dataset.theme=S.theme;else delete document.documentElement.dataset.theme};

function typographyConfig(){return {family:'serif',case:'none',track:0,size:36,weight:400,align:'center',style:'normal',...(S.typography||{})}}
function applyTypography(){
 const t=typographyConfig(),root=document.documentElement;
 const family=t.family==='grotesk'?'Archivo,Arial,sans-serif':t.family==='mono'?'IBM Plex Mono,monospace':'"Instrument Serif",Georgia,serif';
 root.style.setProperty('--type-family',family);
 root.style.setProperty('--type-size',t.size+'px');
 root.style.setProperty('--type-weight',(t.family==='serif'||t.family==='italic')?400:t.weight);
 root.style.setProperty('--type-track',t.track+'em');
 root.style.setProperty('--type-align',t.align);
 root.style.setProperty('--type-case',t.case==='upper'?'uppercase':t.case==='lower'?'lowercase':t.case==='small'?'none':'none');
 root.style.setProperty('--type-style',t.family==='italic'?'italic':'normal');
 root.style.setProperty('--type-variant',t.case==='small'?'small-caps':'normal');
 root.style.setProperty('--type-variant',t.case==='small'?'small-caps':'normal');
}
function updateTypography(){
 const family=$('#tyFamily').value,track=+$('#tyTrack').value,size=+$('#tySize').value,weight=+$('#tyWeight').value,cs=$('#tyCase').value;
 S.typography={...typographyConfig(),family,track,size,weight,case:cs};
 applyTypography();save();
 const tv=$('#tyTrackVal'),sv=$('#tySizeVal'),wv=$('#tyWeightVal'),note=$('#tyWeightNote'),spec=$('#tySpecimen'),wr=$('#tyWeight');
 if(tv)tv.textContent=track.toFixed(2)+'em';if(sv)sv.textContent=size+'px';if(wv)wv.textContent=(family==='serif'||family==='italic')?'400':weight;
 if(wr)wr.disabled=family==='serif'||family==='italic';
 if(note)note.textContent=(family==='serif'||family==='italic')?'Single-cut serif · weight fixed':'Adjust from 300 to 800';
 if(spec){spec.style.fontFamily=family==='grotesk'?'Archivo,Arial,sans-serif':family==='mono'?'IBM Plex Mono,monospace':'"Instrument Serif",Georgia,serif';spec.style.fontStyle=family==='italic'?'italic':'normal';spec.style.fontWeight=(family==='serif'||family==='italic')?400:weight;spec.style.fontSize=size+'px';spec.style.letterSpacing=track+'em';spec.style.textAlign=S.typography.align;spec.style.textTransform=cs==='upper'?'uppercase':cs==='lower'?'lowercase':'none';spec.style.fontVariant=cs==='small'?'small-caps':'normal'}
}
function setTypographyAlign(align){S.typography={...typographyConfig(),align};save();route()}
function resetTypography(){S.typography={family:'serif',case:'none',track:0,size:36,weight:400,align:'center',style:'normal'};save();applyTypography();route()}

const BG={raf:0,key:'',mx:-999,my:-999};
addEventListener('pointermove',e=>{BG.mx=e.clientX;BG.my=e.clientY});
addEventListener('resize',()=>{clearTimeout(BG.rt);BG.rt=setTimeout(()=>{BG.key='';startBg()},200)});
const hexA=(c,a)=>/^#[0-9a-f]{6}$/i.test(c)?c+Math.round(a*255).toString(16).padStart(2,'0'):c;
function startBg(){
 const cv=$('#bg');if(!cv)return;const mode=S.bg||'constellation',cs=getComputedStyle(document.documentElement),C={ac:cs.getPropertyValue('--ac').trim(),ac2:cs.getPropertyValue('--ac2').trim(),mut:cs.getPropertyValue('--mut').trim()},key=mode+C.ac+innerWidth+'x'+innerHeight;
 if(key===BG.key)return;BG.key=key;cancelAnimationFrame(BG.raf);
 const d=devicePixelRatio||1,W=innerWidth,H=innerHeight,x=cv.getContext('2d');cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,W,H);
 if(mode==='none')return;
 const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const P=Array.from({length:Math.min(80,Math.round(W*H/15000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.6+.6,p:Math.random()*6}));
 let t=0;
 const frame=()=>{t+=.01;x.clearRect(0,0,W,H);
  if(mode==='aurora'){[[C.ac2,.3,.7,.55],[C.ac,.8,.3,.4],[C.ac2,.55,.9,.35]].forEach((b,i)=>{const cx=W*(b[1]+Math.sin(t*.7+i*2)*.15),cy=H*(b[2]+Math.cos(t*.5+i)*.12),r=Math.max(W,H)*b[3],g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,hexA(b[0],.28));g.addColorStop(1,hexA(b[0],0));x.fillStyle=g;x.fillRect(0,0,W,H)})}
  else if(mode==='grid'){x.strokeStyle=hexA(C.mut,.16);x.lineWidth=1;x.beginPath();for(let i=0;i<W;i+=48){x.moveTo(i,0);x.lineTo(i,H)}for(let j=0;j<H;j+=48){x.moveTo(0,j);x.lineTo(W,j)}x.stroke();P.slice(0,14).forEach(p=>{const gx=Math.round(p.x/48)*48,gy=Math.round(p.y/48)*48,a=(Math.sin(t*2+p.p)+1)/2;x.fillStyle=hexA(C.ac,a*.8);x.beginPath();x.arc(gx,gy,2.5+a*2,0,6.283);x.fill()})}
  else{P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0});
   for(let i=0;i<P.length;i++){const a=P[i];for(let j=i+1;j<P.length;j++){const b=P[j],dx=a.x-b.x,dy=a.y-b.y,q=dx*dx+dy*dy;if(q<16900){x.strokeStyle=hexA(C.ac2,(1-q/16900)*.35);x.lineWidth=1;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
    const mx=a.x-BG.mx,my=a.y-BG.my,mq=mx*mx+my*my;if(mq<24000){x.strokeStyle=hexA(C.ac,(1-mq/24000)*.7);x.beginPath();x.moveTo(a.x,a.y);x.lineTo(BG.mx,BG.my);x.stroke()}
    x.fillStyle=hexA(a.r>1.6?C.ac:C.mut,.4+.5*Math.abs(Math.sin(t+a.p)));x.beginPath();x.arc(a.x,a.y,a.r,0,6.283);x.fill()}}
  if(!still)BG.raf=requestAnimationFrame(frame)};
 frame()}
function setBg(m){S.bg=m;save();BG.key='';startBg();route()}

function route(){paintTheme();applyTypography();startBg();const h=location.hash.slice(1),a=$('#app');if(!S.in||!S.user){a.innerHTML=h=='login'||h=='signup'?authV(h):landV();return}const p=PG.find(x=>x[0]==h)?h:'dashboard';a.innerHTML='<div class="shell"><nav><div class="logo">✦ Skyline</div>'+PG.map(x=>'<a href="#'+x[0]+'" class="'+(x[0]==p?'on':'')+'"><span>'+x[1]+'</span><span>'+x[2]+'</span></a>').join('')+'</nav><main>'+V[p]()+'</main></div>';if(p=='mentor')paintChat()}
addEventListener('hashchange',route);route();
</script></body></html>
